[workspace]
members = [
  "crates/bytelabs",
  "crates/settings",
  "crates/config"
]
default-members = ["crates/bytelabs"]
resolver = "2"

[workspace.dependencies]
winresource = "0.1.30"
env_logger = "0.11.8"
chrono = "0.4.42"
tokio = "1.48.0"
iced = "0.14.0"
json = "0.12.4"
toml = "0.9.8"

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[workspace.dependencies.cpal]
version = "0.17.1"
features = ["asio", "jack"]

[workspace.dependencies.bytelabs_config]
path = "crates/config"

[workspace.dependencies.bytelabs_aios]
path = "crates/audio_engine"

[workspace.dependencies.bytelabs_settings]
path = "crates/settings"

[workspace.dependencies.log]
features = ["kv_unstable_serde", "serde"]
version = "0.4.29"

[workspace.package]
publish = false
edition = "2024"
