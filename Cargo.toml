[workspace]
members = [
  "crates/bytelabs",
  "crates/settings",
  "crates/config"
]
default-members = ["crates/bytelabs"]
resolver = "2"

[workspace.dependencies]
chrono = "0.4.42"
tokio = "1.48.0"
iced = "0.13.1"
json = "0.12.4"
toml = "0.9.8"

[workspace.dependencies.bytelab-config]
path = "crates/config"

[workspace.dependencies.bytelab-logger]
path = "crates/logger"

[workspace.dependencies.bytelab-settings]
path = "crates/settings"

[workspace.package]
publish = false
edition = "2024"
